<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#123" />
  <title>しらすの山</title>
  <meta name="description" content="一人称3D × 物流・工場自動化 × ちりめんモンスター収集。1,000万匹のしらすの山から、ちりモンを見つけ出せ。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%232f6fb3'/%3E%3Cpath d='M12 34 Q32 22 50 32 L56 28 L54 36 L56 42 L50 36 Q32 44 12 34Z' fill='%23f4efe4'/%3E%3Ccircle cx='17' cy='32' r='2' fill='%23111'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <canvas id="c"></canvas>

    <div id="hud" hidden>
      <div id="crosshair"><span></span></div>
      <div id="prompt"></div>
      <div id="topbar">
        <div id="money" class="chip">0円</div>
        <div id="hand" class="chip"></div>
        <div id="tool" class="chip"></div>
      </div>
      <div id="objective"></div>
      <div id="warn"></div>
      <div id="toasts"></div>
      <div id="perf"></div>
    </div>

    <div id="touch" hidden>
      <div id="lookZone"></div>
      <div id="stickZone"></div>
      <div id="stick"><div id="knob"></div></div>
      <div id="btns">
        <button id="btnRelease" class="tbtn">はなす</button>
        <button id="btnPick" class="tbtn big">つまむ</button>
        <button id="btnAction" class="tbtn">調べる</button>
        <button id="btnTool" class="tbtn small">道具</button>
      </div>
      <button id="btnMenu" class="tbtn menu">≡</button>
    </div>

    <div id="start" class="screen">
      <div class="panel title-panel">
        <h1>しらすの山</h1>
        <p class="tagline">1,000万匹のしらすと、最初からそこにいた「ちりモン」。</p>
        <div class="row">
          <button id="btnContinue" class="primary" hidden>つづきから</button>
          <button id="btnNew" class="primary">はじめる</button>
        </div>
        <div id="startInfo" class="muted"></div>
        <div class="controls-help" id="startHelp"></div>
        <p class="muted small">セーブはこのブラウザ内（IndexedDB）に自動保存されます。</p>
      </div>
    </div>

    <div id="menu" class="screen" hidden>
      <div class="panel wide">
        <div class="tabs" id="tabs">
          <button data-tab="resume" class="primary">▶ 再開</button>
          <button data-tab="dex">図鑑</button>
          <button data-tab="stats">記録</button>
          <button data-tab="settings">設定</button>
          <button data-tab="help">操作</button>
        </div>
        <div id="tabBody"></div>
      </div>
    </div>

    <div id="shop" class="screen" hidden>
      <div class="panel wide">
        <h2>購入端末 <span id="shopMoney" class="chip"></span></h2>
        <div id="shopList"></div>
        <div class="row"><button id="shopClose" class="primary">閉じる</button></div>
      </div>
    </div>

    <div id="rotateHint">横持ち推奨です</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
